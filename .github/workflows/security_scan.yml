name: Scan pmm server and client docker images

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      server_image:
        description: "pmm-server docker image"
        required: false
        default: perconalab/pmm-server:3-dev-latest
        type: string
      client_image:
        description: "pmm-client docker image"
        default: perconalab/pmm-client:3-dev-latest
        required: false
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ${{ inputs.server_image || 'perconalab/pmm-server:3-dev-latest' }}
          - image: ${{ inputs.client_image || 'perconalab/pmm-client:3-dev-latest' }}

    steps:
      - name: Run an image security scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ matrix.image }}
          args: --severity-threshold=critical

      - name: Archive the scan results
        if: ${{ failure()}}
        uses: actions/upload-artifact@v4
        with:
          name: snyk.sarif
          path: snyk.sarif
          retention-days: 7          

      - name: Send Slack notification on failure
        if: ${{ failure() }}
        uses: percona/gh-action-action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_TOKEN }}
          SLACK_USERNAME: "snyk scanner"
          SLACK_ICON_EMOJI: ":octocat:"
          SLACK_COLOR: "#FF0000"
          SLACK_TITLE: "CVE Scan failure"
          SLACK_MESSAGE: "Failed CVE scan for ${{ matrix.image }}"
          SLACK_FOOTER: "Please check the Actions URL ^"
