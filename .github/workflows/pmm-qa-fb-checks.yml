name: "FB Tests"

on:
  workflow_dispatch:
    inputs:
      pmm_qa_branch:
        description: "Branch for PMM-QA to checkout (pmm-qa)"
        required: false
        type: string
        default: "main"
      package_testing_branch:
        description: "Branch for package tests to checkout (package-testing)"
        required: false
        type: string
        default: "master"
      pmm_server_image:
        description: "pmm-server docker image, default perconalab/pmm-server:3-dev-latest"
        required: false
        type: string
        default: "perconalab/pmm-server:3-dev-latest"
      pmm_client_image:
        description: "pmm3-client docker image, default perconalab/pmm-server:3-dev-latest"
        required: false
        type: string
        default: "perconalab/pmm-client:3-dev-latest"
      pmm_client_version:
        description: "pmm3-client version Tarball or Dev-latest, default is dev-latest"
        required: false
        type: string
        default: "latest-tarball"
      launchable_confidence:
        description: "Launchable subset confidence percentage"
        default: '98%'
        required: false
        type: string
      sha:
        description: "SHA (leave empty if running manually, default - 'null')"
        required: false
        type: string

  workflow_call:
    inputs:
      pmm_qa_branch:
        required: false
        type: string
      package_testing_branch:
        required: false
        type: string
      pmm_server_image:
        required: false
        type: string
      pmm_client_image:
        required: false
        type: string
      pmm_client_version:
        required: false
        type: string
      sha:
        required: false
        type: string

jobs:
  helm_tests:
    name: Helm tests
    uses: percona/pmm-qa/.github/workflows/helm-tests.yml@main
    secrets: inherit
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}

  integration_fb_suite:
    name: CLI
    uses: percona/pmm-qa/.github/workflows/fb-integration-suite.yml@main
    secrets:
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version || '3-dev-latest' }}
      launchable_confidence: ${{ inputs.launchable_confidence || '98%' }}

  e2e_fb_suite:
    name: E2E
    uses: percona/pmm-qa/.github/workflows/fb-e2e-suite.yml@PMM-15138-fix-alerting-permissions
    secrets:
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version || '3-dev-latest' }}
      launchable_confidence: ${{ inputs.launchable_confidence || '98%' }}
