name: "FB Tests"

on:
  workflow_dispatch:
    inputs:
      pmm_qa_branch:
        description: "Branch for PMM-QA to checkout (pmm-qa)"
        required: false
        type: string
        default: "main"
      package_testing_branch:
        description: "Branch for package tests to checkout (package-testing)"
        required: false
        type: string
        default: "master"
      pmm_server_image:
        description: "pmm-server docker image, default perconalab/pmm-server:3-dev-latest"
        required: false
        type: string
        default: "perconalab/pmm-server:3-dev-latest"
      pmm_client_image:
        description: "pmm3-client docker image, default perconalab/pmm-server:3-dev-latest"
        required: false
        type: string
        default: "perconalab/pmm-client:3-dev-latest"
      pmm_client_version:
        description: "pmm3-client version Tarball or Dev-latest, default is dev-latest"
        required: false
        type: string
        default: "latest-tarball"
      launchable_confidence:
        description: "Launchable subset confidence percentage"
        default: '98%'
        required: false
        type: string
      sha:
        description: "SHA (leave empty if running manually, default - 'null')"
        required: false
        type: string

  workflow_call:
    inputs:
      pmm_qa_branch:
        required: false
        type: string
      package_testing_branch:
        required: false
        type: string
      pmm_server_image:
        required: false
        type: string
      pmm_client_image:
        required: false
        type: string
      pmm_client_version:
        required: false
        type: string
      sha:
        required: false
        type: string

jobs:
  helm_tests:
    name: Helm tests
    uses: percona/pmm-qa/.github/workflows/helm-tests.yml@main
    secrets: inherit
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}

  integration_fb_suite:
    name: CLI
    uses: percona/pmm-qa/.github/workflows/fb-integration-suite.yml@main
    secrets:
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version || '3-dev-latest' }}
      launchable_confidence: ${{ inputs.launchable_confidence || '98%' }}

  e2e_fb_suite:
    name: E2E
    uses: percona/pmm-qa/.github/workflows/fb-e2e-suite.yml@main
    secrets:
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version || '3-dev-latest' }}
      launchable_confidence: ${{ inputs.launchable_confidence || '98%' }}

  notify_investigator:
    name: Fire Investigator routine
    needs:
      - helm_tests
      - integration_fb_suite
      - e2e_fb_suite
    if: >
      !cancelled() && github.workflow == 'FB Tests' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve pull request number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq 'map(select(.state == "open")) | .[0].number // empty')"
          case "${pr}" in
            '' | *[!0-9]*)
              echo "::notice::FB Tests failed for ${HEAD_SHA} with no open pull request -- Investigator not notified."
              echo "number=" >>"${GITHUB_OUTPUT}"
              ;;
            *)
              echo "number=${pr}" >>"${GITHUB_OUTPUT}"
              ;;
          esac

      - name: Fire Investigator routine
        if: steps.pr.outputs.number != ''
        env:
          # Update this if Investigator's routine is ever recreated.
          ROUTINE_ID: trig_01FhHBdz2yBibyVEfnG5gbQz
          ROUTINE_TOKEN: ${{ secrets.INVESTIGATOR_ROUTINE_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${ROUTINE_TOKEN}" ]; then
            echo "::error::INVESTIGATOR_ROUTINE_TOKEN is not set -- Investigator was not notified of this failure." >&2
            exit 1
          fi
          text="FB Tests failed on ${GITHUB_REPOSITORY} PR #${PR_NUMBER}."
          text="${text} PR: https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
          text="${text} Run: ${RUN_URL}"
          curl -fsS --connect-timeout 10 --max-time 60 -X POST "https://api.anthropic.com/v1/claude_code/routines/${ROUTINE_ID}/fire" \
            -H "Authorization: Bearer ${ROUTINE_TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "${text}" '{text: $text}')"
