# Feature build of PMM-15299-open-manager, the Operations for MongoDB
# (formerly OpenManager) branch every OM PR merges into, built from
# percona/pmm directly.
#
# This build: PMM-15299-open-manager at 85296c123 - the merge of main
# (efc297968) into 6a793233c, plus a fix for golangci-lint v2.14.0. Every
# OM PR that has merged is in it; the one still open, #6084 (PMM-15677),
# is not.
#
# The OM tables' migrations moved from 120-122 to 122-124 in that merge,
# behind main's own 120 and 121. A database that ran an earlier build from
# this branch records 122, so it would skip main's two and then fail creating
# om_bootstrap_secrets again: start this image on a fresh database.
#
# No `url` override: check_deps judges the branch's open PR against main,
# #5872, and fails while that PR is behind or conflicting - which is why
# PR-4571-a9bd41e never built, and why the builds after it came from a fork
# copy or the PMM-15347-om-integration-v3 bundle. Merging main in cleared it.
#
# Builds so far, each the sha of the commit to this branch that triggered it:
#
#   PR-4571-9b5d1f7  pmm at the host-management bootstrap chain
#   PR-4571-7d9f12a  the combined bootstrap + OM-switch bundle
#   PR-4571-a08488b  re-trigger with the hardened bundle
#   PR-4571-2b16f10  bundle 53041711e, first from an OM integration branch
#   PR-4571-b0634ff  bundle 55955bb96, adds two OM fixes found by running the
#                    stack: PMM retries a scoped inventory refresh the app
#                    refused (#5949), and the OM switch tells SEP it is
#                    enabled before asking it to collect (#5888)
#   PR-4571-716cda8  bundle rebased onto the PMM Extensions rename
#   PR-4571-b52f0b9  after fixing a corrupt ui/pnpm-lock.yaml
#   PR-4571-3c88545  after de-duplicating router.tsx's imports
#   PR-4571-a9bd41e  first attempt at the merged branch, off percona/pmm.
#                    Errored in check_deps, never built - see above
#   PR-4571-2f183d5  0bcc5f13c off the fork, so the build could start at all
#   PR-4571-e5e9df2  0bcc5f13c plus #6018's one commit (b06a1ecb2), so a
#                    bootstrapped host's exporter is registered to push
#   PR-4571-1a75a83  #6054 at cdcadc31a, the Operations for MongoDB rename and
#                    page consolidation, off percona/pmm directly
#   PR-4571-15a36bf  bundle b865061f8: PMM-15299-open-manager at 37bf54abd
#                    plus #6084 at 26bafebaf and #6096 at e24992438
#   this build       PMM-15299-open-manager at 85296c123, as above
#
# SEP is absent on purpose: it is not a pmm-submodules dependency and no PMM
# build can produce it. Its side-car image (carrying the matching om_bootstrap
# and om_inventory apps) is built separately and paired with this image at run
# time.
deps:
  - name: pmm
    branch: PMM-15299-open-manager
