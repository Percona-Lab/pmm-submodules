# Feature-build coordinates for the PMM + SEP integration (PMM-15205).
#
# The pin below follows the *tip* of PMM-15205-sep-fb at build time, and the
# published tag is PR-4500-<short sha of this commit>, so the tag alone does not
# say which PMM commit went in. This block records it; refresh it on every
# rebuild of this branch.
#
#   Built:  2026-09-21
#   From:   percona/pmm PMM-15205-sep-fb @ ab6a2a0e0
#           "PMM-15438 Warn when the executor cannot run sudo"
#   Carries: the six UI fixes from the 2026-09-20 end-to-end smoke run on top
#           of the previous build (d92b2646d): a task's header status now
#           tracks its run (PMM-15449), task detail names inventory
#           references instead of raw ids (PMM-15453), the next-runs preview
#           names its zone (PMM-15454), the restore confirmation warns that it
#           writes into live data (PMM-15450), a running diagnostic run's log
#           streams (PMM-15205), and the run form warns when the executor
#           cannot run a sudo snippet (PMM-15438).
#           Paired side-car unchanged: percona/percona-sep:193cd869a...
#
# To tell whether a PR merged into PMM-15205-sep-fb since then is in the latest
# feature build, ask git whether its merge commit is an ancestor of that SHA:
#
#   git merge-base --is-ancestor <merge-commit> ab6a2a0e0 && echo included
#
deps:
  - name: pmm
    branch: PMM-15205-sep-fb
