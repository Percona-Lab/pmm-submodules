# Feature-build coordinates for the PMM + PMM Extensions integration (PMM-15570).
#
# The pin below follows the *tip* of percona/pmm main at build time, and the
# published tag is PR-4500-<short sha of this commit>, so the tag alone does
# not say which PMM commit went in. This block records it; refresh it on every
# rebuild of this branch.
#
#   Built:  2026-09-25
#   From:   percona/pmm main @ 7a20dfff5
#           "PMM-15569 Rename SEP to PMM Extensions (#5992)"
#   Carries: percona/pmm#5992 as merged to main, renaming the SEP integration
#           to PMM Extensions across percona/pmm: the settings API field, env
#           vars, telemetry metric, nginx path, UI routes and copy, Postgres
#           role/database, secrets volume and paths, Ansible roles, internal
#           identifiers and the vendored `@pmm-extensions/*` packages.
#   Paired side-car: percona/percona-sep:a4060c4dceea7656c21450454b89e9d46984050b
#           (unchanged from the previous build).
#
# To tell whether a PR merged into main since then is in the latest feature
# build, ask git whether its merge commit is an ancestor of that SHA:
#
#   git merge-base --is-ancestor <merge-commit> 7a20dfff5 && echo included
#
deps:
  - name: pmm
    branch: main
