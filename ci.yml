# Feature build carrying PMM-15347: the MongoDB host-management bootstrap
# wizard (pmm-managed bootstrap dispatch, the Hosts/Operations UI, abort and
# per-member settings).
#
# No `url` here on purpose: the branch lives in percona/pmm, which is the url
# .gitmodules already gives the `pmm` dependency. PMM-15347-bootstrap-abort-per-member
# is the tip of the stacked PR chain (#5949 backend, #5950 UI, #5951 abort +
# per-member settings), all open against percona/pmm main.
#
# SEP is absent on purpose: it is not a pmm-submodules dependency and no PMM
# build can produce it. Its side-car image (carrying the matching om_bootstrap
# app) is built separately and paired with this image at run time.
deps:
  - name: pmm
    branch: PMM-15347-bootstrap-abort-per-member
