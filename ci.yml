# Feature-build coordinates for the PMM + SEP integration (PMM-15205).
#
# The pin below follows the *tip* of PMM-15205-sep-fb at build time, and the
# published tag is PR-4500-<short sha of this commit>, so the tag alone does not
# say which PMM commit went in. This block records it; refresh it on every
# rebuild of this branch.
#
#   Built:  2026-09-20
#   From:   percona/pmm PMM-15205-sep-fb @ d92b2646d
#           "PMM-15205 Sync the vendored SEP frontend to 193cd869a"
#   Carries: `main` merged in (27 commits, through 8a69bb41a), and the vendored
#           SEP frontend synced to SEP main's tip 193cd869a — which is the same
#           commit the paired side-car image
#           percona/percona-sep:193cd869ad5d178da3104e10452bdfc63320f1fb was
#           built from, so the two halves of the stack carry one SEP version
#           rather than two that drift.
#           Also the whole MySQL Backups / Support diagnostics UX batch merged
#           since the last build: PMM-15450/15451/15452/15453/15454/15455/15457
#           /15458/15490/15509/15510, plus PMM-15406 (ServiceNow connection
#           test) and a check-types fix for PMM-15510.
#
# To tell whether a PR merged into PMM-15205-sep-fb since then is in the latest
# feature build, ask git whether its merge commit is an ancestor of that SHA:
#
#   git merge-base --is-ancestor <merge-commit> d92b2646d && echo included
#
deps:
  - name: pmm
    branch: PMM-15205-sep-fb
