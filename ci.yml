# Feature-build coordinates for the PMM + SEP integration (PMM-15205).
#
# The pin below follows the *tip* of PMM-15205-sep-fb at build time, and the
# published tag is PR-4500-<short sha of this commit>, so the tag alone does not
# say which PMM commit went in. This block records it; refresh it on every
# rebuild of this branch.
#
#   Built:  2026-09-21
#   From:   percona/pmm PMM-15205-sep-fb @ 8b4556f3f
#           "PMM-15205 Keep a live log open until it finishes"
#   Carries: `main` merged in again (a31cc4593, through 381d20743), the six
#           smoke-run UI fixes (c70eeeace), the pending-run gate on the
#           diagnostics live log viewer (8c50951eb), the log viewer keeping a
#           live log that ended with a terminal `finish` instead of blanking
#           and re-fetching it, scoped to its own history (dfe148d7f,
#           b0736d70b, 5483ccbf7, 3a020ce91, c5b207a87, 23debdc1f), no
#           synthetic U+0000 trailing row (3a268af27, from SEP-2102), the log
#           pane appending new lines instead of clearing and re-parsing the
#           whole log on every chunk (a14e6d73d), and the viewer keeping a
#           live stream open when the polled status turns terminal before the
#           stream's own `finish` (8b4556f3f).
#           IDs are post-rewrite: the branch was re-hashed on 2026-09-21 to
#           re-author a Copilot merge for the CLA; pre-rewrite history is on
#           percona/pmm branch PMM-15205-sep-fb-pre-cla-rewrite.
#           Paired side-car: percona/percona-sep:83e40358c7ecaeeb62f1bae04bda759b5f3d3864
#           (SEP-2096, SEP-2062, SEP-2098, SEP-2035, SEP-2043).
#
# To tell whether a PR merged into PMM-15205-sep-fb since then is in the latest
# feature build, ask git whether its merge commit is an ancestor of that SHA:
#
#   git merge-base --is-ancestor <merge-commit> 8b4556f3f && echo included
#
deps:
  - name: pmm
    branch: PMM-15205-sep-fb
