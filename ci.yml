# Feature build carrying the OpenManager work: the MongoDB host-management
# bootstrap wizard (pmm-managed bootstrap dispatch, the Hosts/Operations UI,
# abort and per-member settings) and the OM on/off switch.
#
# PMM-15659-operations-rename is PMM-15299-open-manager, the OM work's own
# integration branch, plus the unmerged #6054 - see "What this build adds"
# below. Every OM pull request has merged into that branch:
#
#   #5866 PMM-15360-om-switch-flag              the Settings flag
#   #5853 PMM-15360-om-nav-gate                 nav + page gating
#   #5888 PMM-15360-om-service-gate             the service gate, SEP client hardening
#   #5921 PMM-15326-pagination-envelope-fix     SEP's paginated envelope
#   #5995 PMM-15326-sep-env-token-log           stop logging the extensions token
#   #5949 PMM-15347-bootstrap-backend           bootstrap driven from pmm-managed
#   #5950 PMM-15347-bootstrap-ui                the Hosts and Automations UI
#   #5951 PMM-15347-bootstrap-abort-per-member  abort + per-member settings
#
# This replaces PMM-15347-om-integration-v3, a no-PR bundle carrying those same
# eight chains, assembled by hand because none of them had landed anywhere a
# build could name. The merges happened, so the bundle has nothing left to do.
#
# ---------------------------------------------------------------------------
# What this build adds on top of the integration branch
# ---------------------------------------------------------------------------
#
# percona/pmm#6054, "PMM-15659: Rename OpenManager to Operations for MongoDB
# and consolidate its pages" - 26 commits, open against PMM-15299-open-manager,
# 0 behind it. UI-side rename to a developer preview, four pages (Fleet, Nodes,
# Automations, Settings) under /operations with redirects from the old /om
# paths, the glossary pass, column budgets, empty states and a service detail
# drawer. Built here so the pages can be checked in a real PMM image.
#
# #6018 (bootstrap push metrics), which the previous build carried as an extra
# commit, has since merged into PMM-15299-open-manager, so #6054's head carries
# it too (merge e125da0a9). Nothing is lost by switching.
#
# ---------------------------------------------------------------------------
# Why there is no `url` override any more
# ---------------------------------------------------------------------------
#
# The previous build pointed at a fork snapshot to get past ci.py's check_deps,
# which exits 1 when a dependency branch's open PR *against main* is behind or
# dirty. That bit PMM-15299-open-manager (#5872, conflicting). check_deps only
# queries PRs with base main, and #6054's base is PMM-15299-open-manager, so
# PMM-15659-operations-rename has nothing for it to judge and builds straight
# from percona/pmm - no snapshot to keep re-pushing.
#
# Drop the branch back to PMM-15299-open-manager once #6054 merges.
#
# 99 ahead of upstream/main and 13 behind, so the build carries main as of the
# integration branch's last merge rather than main's tip. Note the commit sha
# from the build if you need to know exactly what an image contains.
#
# Builds so far, each the sha of the commit to this branch that triggered it:
#
#   PR-4571-9b5d1f7  pmm at the host-management bootstrap chain
#   PR-4571-7d9f12a  the combined bootstrap + OM-switch bundle
#   PR-4571-a08488b  re-trigger with the hardened bundle
#   PR-4571-2b16f10  bundle 53041711e, first from an OM integration branch
#   PR-4571-b0634ff  bundle 55955bb96, adds two OM fixes found by running the
#                    stack: PMM retries a scoped inventory refresh the app
#                    refused (#5949), and the OM switch tells SEP it is
#                    enabled before asking it to collect (#5888)
#   PR-4571-716cda8  bundle rebased onto the PMM Extensions rename
#   PR-4571-b52f0b9  after fixing a corrupt ui/pnpm-lock.yaml
#   PR-4571-3c88545  after de-duplicating router.tsx's imports
#   PR-4571-a9bd41e  first attempt at the merged branch, off percona/pmm.
#                    Errored in check_deps, never built - see above
#   PR-4571-2f183d5  0bcc5f13c off the fork, so the build could start at all.
#                    Same eight chains as the bundle; what changed was where it
#                    came from
#   PR-4571-e5e9df2  0bcc5f13c plus #6018's one commit (b06a1ecb2), so a
#                    bootstrapped host's exporter is registered to push. The
#                    first build here carrying something not yet merged
#   this build       #6054 at cdcadc31a, the Operations for MongoDB rename and
#                    page consolidation, off percona/pmm directly
#
# SEP is absent on purpose: it is not a pmm-submodules dependency and no PMM
# build can produce it. Its side-car image (carrying the matching om_bootstrap
# and om_inventory apps) is built separately and paired with this image at run
# time. Those apps are on PMM Extensions main, so a current side-car build has
# them.
deps:
  - name: pmm
    branch: PMM-15659-operations-rename
